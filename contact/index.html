<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hsiao Studio | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090c10;
            --card-bg: rgba(22, 27, 34, 0.85);
            --accent-color: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.35);
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --nav-bg: rgba(9, 12, 16, 0.8);
            --input-bg: #0d1117;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(31, 111, 235, 0.08) 0%, transparent 50%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1050px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-brand span { color: var(--accent-color); }

        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 1.5rem;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover, .nav-link.active { color: var(--accent-color); }

        .container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            padding: 4rem 1.5rem 5rem;
            flex: 1;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .info-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
        }

        .info-panel p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: var(--input-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 140px;
        }

        .btn {
            display: inline-block;
            text-align: center;
            background-color: var(--accent-color);
            color: #090c10;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        footer {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="../" class="nav-brand">HSIAO<span>STUDIO</span></a>
            <ul class="nav-links">
                <li><a href="../" class="nav-link">Home</a></li>
                <li><a href="../games/" class="nav-link">Games</a></li>
                <li><a href="./" class="nav-link active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="info-panel">
            <h1 class="section-title">Contact Us</h1>
            <p>Send a message directly to support regarding any of our games.</p>
            
            <form action="https://formsubmit.co/support.hsiao.studio@gmail.com" method="POST" class="contact-form">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_subject" value="New message from Hsiao Studio Site">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="yourname@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="btn" style="align-self: flex-start;">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hsiao Studio. All rights reserved.</p>
    </footer>

</body>
</html>
